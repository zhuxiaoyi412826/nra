<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>3D方块人</title>
    <style>
        body { margin:0; background:#111; }
        canvas { display:block; }
    </style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>

<script>
// 场景
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x333);

// 相机
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 5;
camera.position.y = 1.5;

// 渲染器
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// 灯光
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5,5,5);
scene.add(light);
scene.add(new THREE.AmbientLight(0xffffff, 0.5));

// 创建立方体
function make(x,y,z,w,h,d,col) {
    const g = new THREE.BoxGeometry(w,h,d);
    const m = new THREE.MeshLambertMaterial({color:col});
    const mesh = new THREE.Mesh(g,m);
    mesh.position.set(x,y,z);
    return mesh;
}

// 人物
const player = new THREE.Group();
scene.add(player);

// 头
player.add(make(0,2.2,0, 1,1,1, 0xffd9c2));

// 身体
player.add(make(0,0.8,0, 1.3,1.6,0.6, 0x5c6b7c));

// 手臂
player.add(make(0.9,0.9,0, 0.45,1.2,0.45, 0x5c6b7c));
player.add(make(-0.9,0.9,0, 0.45,1.2,0.45, 0x5c6b7c));

// 腿
player.add(make(0.4,-0.4,0, 0.5,1.2,0.5, 0x444444));
player.add(make(-0.4,-0.4,0, 0.5,1.2,0.5, 0x444444));

// 枪df
player.add(make(-1.6,0.8,0, 1.4,0.2,0.2, 0x222222));
player.add(make(-2.3,0.8,0, 0.2,0.15,0.15, 0x333333));

// 动画
function animate() {
    requestAnimationFrame(animate);
    player.rotation.y += 0.005;
    renderer.render(scene, camera);
}
animate();

// 自适应
window.onresize = ()=>{
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
};
</script>

</body>
</html>
